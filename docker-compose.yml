# Local dependencies for algo-trading-monolith (app runs on host: `java -jar`).
# Start everything:   docker compose up -d
# Stop:               docker compose down        (add -v to also wipe the DB volume)
# Logs:               docker compose logs -f
#
# AUTO-READS the .env in this folder (the SAME file the app loads) for the ${...}
# values below. Blank/unset → the :- default. So set once in .env and both the
# container and the host app use the same DB creds:
#   DB_USERNAME=algo         # Postgres user  (default: algo)
#   DB_PASSWORD=algo         # Postgres pass  (default: algo)
#   POSTGRES_DB=algo_trading # DB name        (default: algo_trading)
# To make the host app use THIS Postgres (not Neon), also point it here in .env:
#   DB_URL=jdbc:postgresql://localhost:5432/algo_trading
#   DB_DIRECT_URL=jdbc:postgresql://localhost:5432/algo_trading
# Kafka has no secrets. Enable it in application.yml: app.kafka.enabled=true
#
# Gives the host app:  PostgreSQL @ localhost:5432   Kafka @ localhost:9092

services:
  postgres:
    image: postgres:16-alpine
    container_name: algo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-algo_trading}
      POSTGRES_USER: ${DB_USERNAME:-algo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-algo}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0          # single-node KRaft (no ZooKeeper)
    container_name: algo-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
