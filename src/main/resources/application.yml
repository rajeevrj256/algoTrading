server:
  port: 8080

spring:
  application:
    name: algo-trading-monolith
  jackson:
    serialization:
      write-dates-as-timestamps: false

  # ── PostgreSQL Database ──────────────────────────────────────
  datasource:

    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Flyway uses SESSION-level advisory locks, which break on Neon's PgBouncer
    # (-pooler) endpoint. Run migrations over the DIRECT (non-pooled) endpoint —
    # same host without "-pooler". Runtime datasource above can stay on the pooler.
    url: "jdbc:postgresql://ep-twilight-haze-a1t2g6eh.ap-southeast-1.aws.neon.tech:5432/neondb"
    user: "neondb_owner"
    password: "npg_qK4o5DepPkxY"

  # ── Kafka ────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: 1
    consumer:
      auto-offset-reset: earliest

# ── Application Settings ──────────────────────────────────────
# Indices (NIFTY_50/BANKNIFTY/FINNIFTY) removed — not cash-equity tradeable; the
# charges model is intraday equity. Add them back only via an F&O code path.
app:
  symbols: RELIANCE,TCS,INFY,HDFCBANK,ICICIBANK,SBIN,LT,AXISBANK,ITC,BHARTIARTL,KOTAKBANK
  candle-count: 120
  scan-interval-ms: 300000        # 5 minutes
  exit-check-interval-ms: 15000   # 15 seconds for open-position SL/target checks
  scan-initial-delay-ms: 5000     # wait 5s after startup
  auto-shutdown:
    enabled: true
    cron: "0 27 15 * * MON-FRI"   # shut app down at 3:27 PM IST after EOD
  kafka:
    enabled: true                # set true only when a Kafka broker is available
  datafeed:
    provider: groww               # yahoo | groww

symbol-source:
  cache-ttl-minutes: 30
  refresh-interval-ms: 1800000    # refresh shortlist cache every 30 min
  refresh-initial-delay-ms: 10000
  fallback-enabled: true          # use app.symbols when intraday_symbol table is empty

# ── Data Feed ─────────────────────────────────────────────────
datafeed:
  cache:
    ttl-seconds: 60

# ── Groww Trading API ─────────────────────────────────────────
# Used when app.datafeed.provider = groww
# Get API key + secret from https://groww.in/user/profile/trading-apis
# The service auto-exchanges them for a daily access token (SHA256 checksum flow).
groww:
  base-url: https://api.groww.in
  api-version: "1.0"
  min-request-gap-ms: 150         # stay below Groww's per-second burst limits
  api-key: ""
  api-secret: ""
  # Optional: paste a manually-generated access token to skip the exchange flow.
  access-token: ""

# ── Risk Management ───────────────────────────────────────────
risk:
  capital: 100000               # ₹1,00,000 trading capital
  daily-target: 2000             # Stop trading after ₹2,000 profit (~2% of capital)
  daily-max-loss: 1500           # Circuit breaker at ₹1,500 loss (~7 full-stop losses)
  max-trades-per-day: 150
  # NOTE: min-rr-ratio MUST match what the strategies actually emit.
  # Strategies design RR ~1.5-1.8 (EMA 1.67, VWAP ≤1.8, ORB ≤1.5). The old 2.1
  # silently rejected EMA/VWAP/ORB/GAP_GO and only let SUPERTREND whipsaws through.
  min-confidence: 0.65
  min-rr-ratio: 1.5
  risk-per-trade-pct: 0.2       # 0.2% of capital per trade

# ── Paper Broker ──────────────────────────────────────────────
broker:
  slippage-pct: 0.02            # 0.02% price slippage on fills
  # Trailing/breakeven stop — stops winners turning into losers and locks profit
  # when a winner reverses before the (far) target. Attacks realized-RR < designed-RR.
  trailing:
    enabled: true
    breakeven-trigger-r: 1.0    # at +1R favorable, move stop to entry (breakeven)
    trail-start-r: 1.5          # beyond +1.5R, start trailing
    trail-giveback-r: 1.0       # trail locks (peakR − 1.0)R of profit

# ── Trading Charges (India cash equity) ──────────────────────
charges:
  intraday: true                # true = intraday/MIS, false = delivery/CNC
  brokerage-rate: 0.0003        # 0.03% per order
  brokerage-cap-per-order: 20   # ₹20 max per order
  stt-intraday-sell-rate: 0.00025
  stt-delivery-buy-rate: 0.001
  stt-delivery-sell-rate: 0.001
  exchange-rate: 0.0000325
  gst-rate: 0.18
  sebi-rate: 0.000001
  stamp-intraday-buy-rate: 0.00003
  stamp-delivery-buy-rate: 0.00015

# ── Database ──────────────────────────────────────────────────
# Trade data is persisted to PostgreSQL (see spring.datasource above).
# To set up:
#   1. Install PostgreSQL
#   2. CREATE DATABASE algo_trading;
#   3. Tables are auto-created by Flyway on startup

# ── Telegram Notifications ────────────────────────────────────
# Setup:
#   1. Message @BotFather on Telegram → /newbot → copy BOT_TOKEN
#   2. Start a chat with your bot
#   3. Call: https://api.telegram.org/bot<TOKEN>/getUpdates → find your chat_id
#   4. Paste values below:
notification:
  telegram:
    bot-token: ""
    chat-id: ""          # e.g. -1001234567890

# ── Health Checks ─────────────────────────────────────────────
health:
  check-interval-ms: 900000     # 15 minutes

# ── Actuator ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ── Logging ───────────────────────────────────────────────────
logging:
  level:
    com.algotrading: DEBUG
    root: INFO
  pattern:
    console: "%d{HH:mm:ss} | %-8level | %msg%n"
