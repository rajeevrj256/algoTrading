server:
  port: 8080

spring:
  application:
    name: algo-trading-monolith
  # Secrets come from environment variables (or a local .env file — gitignored).
  # Copy .env.example → .env and fill in values. NEVER commit real credentials.
  config:
    import: "optional:file:.env[.properties]"
  jackson:
    serialization:
      write-dates-as-timestamps: false

  # ── PostgreSQL Database ──────────────────────────────────────
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/algo_trading}"
    username: "${DB_USERNAME:}"
    password: "${DB_PASSWORD:}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Flyway needs session advisory locks, which BREAK through PgBouncer
    # (Neon's -pooler endpoint) → "Unable to release PostgreSQL advisory lock".
    # Always run Flyway over the DIRECT endpoint (host WITHOUT "-pooler").
    # The app's runtime pool (spring.datasource) can keep using the pooler.
    url: "${DB_DIRECT_URL:${DB_URL:jdbc:postgresql://localhost:5432/algo_trading}}"
    user: "${DB_USERNAME:}"
    password: "${DB_PASSWORD:}"

  # ── Kafka ────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: 1
    consumer:
      auto-offset-reset: earliest

# ── Application Settings ──────────────────────────────────────
app:
  symbols: NIFTY_50,BANKNIFTY,FINNIFTY,RELIANCE,TCS,INFY,HDFCBANK,ICICIBANK,SBIN,LT,AXISBANK,ITC,BHARTIARTL,KOTAKBANK
  candle-count: 120
  scan-interval-ms: 300000        # 5 minutes
  exit-check-interval-ms: 5000    # 5 seconds for open-position SL/target checks (faster exits)
  scan-initial-delay-ms: 5000     # wait 5s after startup
  auto-shutdown:
    enabled: true
    cron: "0 27 15 * * MON-FRI"   # shut app down at 3:27 PM IST after EOD
  kafka:
    enabled: true               # set true ONLY when a Kafka broker is running at spring.kafka.bootstrap-servers.
                                 # When false, non-critical work (trade log, candle ingest, alerts) is saved
                                 # directly (synchronous fallback) — no broker needed. Enabling this without a
                                 # live broker makes every publish block then throw (backtests 500, log spam).
  datafeed:
    # yahoo | groww — Groww LTP/candles need their PAID data plan (free-plan keys
    # get 403 on all market-data endpoints even though token exchange succeeds).
    # Yahoo is free and handles indices (^NSEI etc.) + equities (.NS).
    provider: groww

symbol-source:
  cache-ttl-minutes: 30
  refresh-interval-ms: 1800000    # refresh shortlist cache every 30 min
  refresh-initial-delay-ms: 10000
  fallback-enabled: true          # use app.symbols when intraday_symbol table is empty

# ── Backtesting (after-hours) ─────────────────────────────────
# Groww PAID historical-data API feeds both engines. Split endpoints:
#   POST /api/backtest/equity?symbols=RELIANCE,TCS&strategy=&days=30   (cash, cash charges)
#   POST /api/backtest/fno?symbols=NIFTY,BANKNIFTY&strategy=&days=30    (real FNO premiums)
# F&O uses REAL Groww FNO option candles; signals with no option data are counted
# as "skipped" in the result (no synthetic pricing).
backtest:
  lookback-days: 30               # default window when the endpoint omits ?days=
  groww:
    interval-minutes: 5           # candle granularity (match the live 5-min feed)
    max-days-per-request: 15      # chunk size — Groww caps 1-5 min candles at 15 days per request

# ── Data Feed ─────────────────────────────────────────────────
datafeed:
  cache:
    ttl-seconds: 90
  yahoo:
    min-request-gap-ms: 1200            # Yahoo 429s bursts — space requests out
    rate-limit-cooldown-seconds: 180    # after a 429: back off (doubles per repeat, max 30 min), serve stale cache

# ── Groww Trading API ─────────────────────────────────────────
# Used when app.datafeed.provider = groww
# Get API key + secret from https://groww.in/user/profile/trading-apis
# The service auto-exchanges them for a daily access token (SHA256 checksum flow).
groww:
  base-url: https://api.groww.in
  api-version: "1.0"
  min-request-gap-ms: 150         # stay below Groww's per-second burst limits
  api-key: "${GROWW_API_KEY:}"
  api-secret: "${GROWW_API_SECRET:}"
  # Optional: paste a manually-generated access token to skip the exchange flow.
  access-token: "${GROWW_ACCESS_TOKEN:}"

# ── Risk Management ───────────────────────────────────────────
risk:
  capital: 10000000               # ₹1,00,00,000 trading capital
  daily-target: 100000            # Stop trading (protect gains) once today's net profit hits ₹100,000
  daily-max-loss: 50000          # Circuit breaker: halt trading once today's net loss hits ₹40,000
  max-trades-per-day: 25
  min-confidence: 0.70
  min-rr-ratio: 2.1
  risk-per-trade-pct: 0.2       # 0.2% of capital per trade
  stop-cooldown-min: 20         # block re-entry on a symbol after a stop-loss exit

# ── F&O (Index Options) ───────────────────────────────────────
# When enabled, signals on the indices below are executed as LONG option paper
# orders on the option chain: BUY index → buy CE, SELL index → buy PE, at the
# ATM strike (± itm-offset-steps) of the nearest expiry. Exit decisions run on
# the underlying index levels; fills use the option premium LTP (Groww FNO),
# with a Black-Scholes synthetic fallback when no live quote is available.
# Lot sizes / strike steps / expiry days follow NSE circulars — update HERE,
# not in code, when the exchange revises them.
# ── Trading engines (equity + F&O run in parallel) ────────────
# Each live scan runs an EQUITY pass then an F&O pass, each with its own symbols,
# its own strategies (strategy_config.segment), and its own order tables
# (equity → open_position/trade_log, F&O → fno_open_position/fno_trade_log).
# Toggle either independently: both on = run both; turn one off to run one only.
# The F&O pass also requires fno.enabled below (the option-conversion master switch).
trading:
  equity:
    enabled: false
  fno:
    enabled: true

fno:
  enabled: true
  risk-per-trade-pct: 0.75      # target % of capital risked per option trade (premium risk)
  max-risk-per-trade-pct: 2.5   # hard cap — 1 lot is the minimum position and may exceed the target
  max-lots-per-trade: 4
  max-premium-per-trade: 300000  # cap on total premium outlay ₹
  premium-hard-stop-pct: 35     # exit if premium drops this % below entry (theta/IV guard)
  itm-offset-steps: 0           # 0 = ATM; 1 = one strike in-the-money (higher delta)
  synthetic-iv: 0.14            # IV for the synthetic pricing fallback
  risk-free-rate: 0.065
  expiry-day-entry-cutoff-min: 90   # no fresh entries within N min of close on expiry day
  underlyings:
    NIFTY:      { lot-size: 75,  strike-step: 50,  expiry-day: TUESDAY, weekly-expiry: true }
    BANKNIFTY:  { lot-size: 35,  strike-step: 100, expiry-day: TUESDAY, weekly-expiry: false }
    FINNIFTY:   { lot-size: 65,  strike-step: 50,  expiry-day: TUESDAY, weekly-expiry: false }
    MIDCPNIFTY: { lot-size: 140, strike-step: 25,  expiry-day: TUESDAY, weekly-expiry: false }

# ── Paper Broker ──────────────────────────────────────────────
broker:
  slippage-pct: 0.02            # 0.02% price slippage on fills

# ── Trading Charges (India cash equity) ──────────────────────
charges:
  intraday: true                # true = intraday/MIS, false = delivery/CNC
  brokerage-rate: 0.0003        # 0.03% per order
  brokerage-cap-per-order: 20   # ₹20 max per order
  stt-intraday-sell-rate: 0.00025
  stt-delivery-buy-rate: 0.001
  stt-delivery-sell-rate: 0.001
  exchange-rate: 0.0000325
  gst-rate: 0.18
  sebi-rate: 0.000001
  stamp-intraday-buy-rate: 0.00003
  stamp-delivery-buy-rate: 0.00015
  # ── F&O (index options) — charged on PREMIUM value ──
  fno:
    brokerage-flat: 20          # ₹20 flat per order (discount-broker model)
    stt-sell-rate: 0.001        # STT 0.1% on sell-side premium
    exchange-rate: 0.0003503    # NSE options transaction charge
    sebi-rate: 0.000001
    gst-rate: 0.18
    stamp-buy-rate: 0.00003     # 0.003% on buy-side premium

# ── Database ──────────────────────────────────────────────────
# Trade data is persisted to PostgreSQL (see spring.datasource above).
# To set up:
#   1. Install PostgreSQL
#   2. CREATE DATABASE algo_trading;
#   3. Tables are auto-created by Flyway on startup

# ── Telegram Notifications ────────────────────────────────────
# Setup:
#   1. Message @BotFather on Telegram → /newbot → copy BOT_TOKEN
#   2. Start a chat with your bot
#   3. Call: https://api.telegram.org/bot<TOKEN>/getUpdates → find your chat_id
#   4. Paste values below:
notification:
  telegram:
    bot-token: "${TELEGRAM_BOT_TOKEN:}"
    chat-id: "${TELEGRAM_CHAT_ID:}"          # e.g. -1001234567890

# ── Health Checks ─────────────────────────────────────────────
health:
  check-interval-ms: 900000     # 15 minutes

# ── Actuator ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ── Logging ───────────────────────────────────────────────────
logging:
  level:
    com.algotrading: DEBUG
    root: INFO
  pattern:
    console: "%d{HH:mm:ss} | %-8level | %msg%n"
